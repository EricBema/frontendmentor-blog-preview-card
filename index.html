<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="styles.css">
  
  <title>Frontend Mentor | Blog preview card</title>

  
</head>
<body>

  <div class="blog-card-container">
      <figure>
        <img class="blog-image" src="assets/images/illustration-article.svg" alt="illustration">
      </figure>
      <div class="blog-content">
        <p class="category"><strong>Learning</strong></p>
        <p class="date">Published 25 Jul 2026</p>
        <h1 class="title">HTML & CSS foundations</h1>
        <p class="description">These languages are the backbone of every website, defining structure, content, and presentation.</p>
      </div>
      <div class="author">
        <img class="user-pic" src="assets/images/image-avatar.webp" alt="image of author">
        <p class="author-name">Greg Hooper</p>
      </div>
  </div>
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Eric Bema</a>.
  </footer>
</body>
</html>
